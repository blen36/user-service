spring.application.name=user-service
spring.profiles.default=local
server.port=${SERVER_PORT:8081}
spring.jpa.properties.hibernate.default_batch_fetch_size=32

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.cache.type=redis
spring.cache.cache-names=users
spring.cache.redis.time-to-live=10m

auth.jwt.issuer=authentication-service
auth.jwt.audience=java-advanced-api
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8082/.well-known/jwks.json}

user.registration-key=${AUTH_REGISTRATION_KEY}
